<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card</title>
  <link rel="stylesheet" href="product-card.css">
</head>
<body>

  <div class="product-card">
    <div class="image-box">
      <img
        src="https://placehold.co/400x300?text=Headphones"
        alt="Black wireless over-ear headphones"
        class="product-image"
      >
      <span class="sale-badge">Sale</span>
    </div>

    <div class="product-details">
      <h2 class="product-name">Wireless Headphones</h2>

      <p class="product-price">
        ₹1,999
        <span class="old-price">₹2,999</span>
      </p>

      <p class="product-description">
        Comfortable over-ear headphones with clear sound
        and long battery life.
      </p>

      <button class="add-to-cart">Add to Cart</button>
    </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Marks Table</title>
  <link rel="stylesheet" href="student-table.css">
</head>
<body>

  <table class="marks-table">
    <caption>Student Marks</caption>

    <thead>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Subject</th>
        <th scope="col">Marks</th>
        <th scope="col">Grade</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>Rahul</td>
        <td>HTML</td>
        <td>92</td>
        <td>A</td>
      </tr>

      <tr>
        <td>Priya</td>
        <td>CSS</td>
        <td>88</td>
        <td>A</td>
      </tr>

      <tr>
        <td>Arjun</td>
        <td>JavaScript</td>
        <td>75</td>
        <td>B</td>
      </tr>

      <tr>
        <td>Sneha</td>
        <td>Python</td>
        <td>81</td>
        <td>B</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
